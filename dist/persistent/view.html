<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pencil</title>
<style>
:root{color-scheme:dark}html,body{margin:0;inline-size:100%;block-size:100%;font:14px system-ui;background:#18181b;color:#fafafa}body{display:flex;flex-direction:column;gap:0;padding:0}main{position:relative;display:flex;align-items:stretch;flex:1 1 0;min-inline-size:0;min-block-size:0;gap:0;padding:0}img{display:block;inline-size:100%;block-size:100%;min-inline-size:0;min-block-size:0;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none}img:focus-visible{outline:2px solid #7dd3fc;outline-offset:-2px}
/* Transient feedback overlays the editor; it never reserves a toolbar or changes its viewport. */
[role=status]{position:absolute;inset-block-start:8px;inset-inline-start:8px;max-inline-size:calc(100% - 16px);padding:8px 12px;background:#27272a;border-radius:4px;pointer-events:none}
[role=status][data-quiet]{inline-size:1px;block-size:1px;inset:0;padding:0;clip-path:inset(50%);white-space:nowrap}
</style>
<main aria-label="Pencil editor" data-testid="remote-editor-viewport"><img tabindex="0" data-testid="remote-editor-image" aria-keyshortcuts="Meta+S Control+S" alt="Live Pencil editor. Click to focus, then use the pointer or keyboard. Command or Control S saves the source document. Screen-reader access to editor objects is not available in this view."><span role="status" data-testid="remote-view-status" aria-live="polite">Connecting…</span></main>
<script type="module" src="/view.mjs"></script></html>
